<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div style="text-align:right; padding:20px;">

    <button onclick="darkMode()" class="dark-btn">
        Dark Mode
    </button>

</div>

<h1>College Placement Portal</h1>

<div class="box">

    <h2>Student Registration</h2>

    <form method="POST" action="/register">

        <input type="text"
        name="name"
        placeholder="Full Name"
        required>

        <input type="email"
        name="email"
        placeholder="Email"
        required>

        <input type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already registered?
        <a href="/">Login here</a>
    </p>

    <p>
        <a href="/admin_login">Admin Login</a>
    </p>

</div>

<footer>
    Developed by Tharun
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
