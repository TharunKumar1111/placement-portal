<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div style="text-align:right; padding:20px;">

    <button onclick="darkMode()" class="dark-btn">
    🌙
</button>

</div>

<h1>College Placement Portal</h1>

<div class="box">

    <h2>Student Login</h2>

    {% if error %}
        <div class="flash">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/login">

        <input type="email"
        name="email"
        placeholder="Email"
        required>

        <input type="password"
        name="password"
        placeholder="Password"
        required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New student?
        <a href="/register">Register here</a>
    </p>

    <p>
        <a href="/admin_login">Admin Login</a>
    </p>

</div>

<footer>
    Developed by Tharun
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
